<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Report Produksi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00875F">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
    --bg: #F3EEE2;
    --bg-dot: rgba(28,29,31,0.07);
    --ink: #201F1C;
    --ink-soft: #77746C;
    --ink-faint: #ACA89D;
    --surface: #FFFFFF;
    --surface-2: #FAF7EF;
    --border: rgba(32,31,28,0.10);
    --mint: #00B383;
    --mint-deep: #00875F;
    --mint-ink: #DCF4EA;
    --mint-text: #036A4B;
    --danger: #E24545;
    --danger-ink: #FBE1E1;
    --danger-text: #A82A2A;
    --radius: 24px;
    --radius-sm: 16px;
    --shadow-card: 0 1px 0 rgba(32,31,28,0.04), 0 10px 22px rgba(32,31,28,0.06);
    --shadow-pop: 0 4px 0 rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    color: var(--ink);
    min-height: 100vh;
    padding: 26px 16px 40px;
  }
  .card {
    background: var(--surface); border-radius: var(--radius); padding: 18px;
    border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 14px;
  }
  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 999px;
    background: var(--mint); color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; margin-top: 8px; font-family: var(--font-display);
    box-shadow: var(--shadow-pop); letter-spacing: 0.2px;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--border); box-shadow: none; }

  .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--surface);
    border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 17px; flex-shrink: 0; box-shadow: var(--shadow-card);
  }
  .top-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; }
  .top-sub { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }

  .role-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--mint-ink);
    color: var(--mint-text); padding: 6px 12px; border-radius: 999px;
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase;
  }

  .status-box { padding: 13px 16px; border-radius: var(--radius-sm); font-weight: 700; text-align: center; font-size: 14px; }
  .status-fail { background: var(--danger-ink); color: var(--danger-text); border: 1px solid rgba(226,69,69,0.2); }
  .info-text { font-size: 13px; color: var(--ink-soft); text-align: center; margin: 8px 0; font-weight: 600; line-height: 1.55; }

  /* Layar tunggu & tolak */
  .screen { display: none; }
  .screen.active { display: block; }
  .center-screen { min-height: 74vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .big-emoji { font-size: 52px; margin-bottom: 14px; }
  .center-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  .spinner {
    width: 34px; height: 34px; border: 3.5px solid var(--border);
    border-top-color: var(--mint); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  .placeholder-card {
    border: 2px dashed var(--border); background: var(--surface-2);
    border-radius: var(--radius); padding: 30px 20px; text-align: center;
  }
  .placeholder-emoji { font-size: 38px; margin-bottom: 10px; }
  .placeholder-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 6px; }

  /* Komponen report */
  label { font-size: 13px; color: var(--ink-soft); font-weight: 700; display: block; margin-bottom: 6px; }
  input[type=date] {
    width: 100%; padding: 11px 12px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--surface-2);
    color: var(--ink); font-size: 15px; font-family: var(--font-body);
  }
  .status-note { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-top: 10px; min-height: 16px; }
  .status-note.error { color: var(--danger-text); }
  pre.preview {
    white-space: pre-wrap; word-wrap: break-word;
    font-family: 'SF Mono', Consolas, Menlo, monospace;
    font-size: 13.5px; line-height: 1.6;
    background: var(--surface-2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px; margin: 0; min-height: 60px;
    color: var(--ink);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:disabled:active { transform: none; box-shadow: var(--shadow-pop); }
</style>
</head>
<body>

<!-- ===== 1. MEMERIKSA AKSES ===== -->
<div class="screen active" id="screenLoading">
  <div class="center-screen">
    <div class="spinner"></div>
    <p class="info-text" style="margin-top:16px">Memeriksa akses…</p>
  </div>
</div>

<!-- ===== 2. AKSES DITOLAK ===== -->
<div class="screen" id="screenTolak">
  <div class="center-screen">
    <div class="big-emoji">🔒</div>
    <div class="center-title">Halaman ini bukan untuk role kamu</div>
    <p class="info-text" id="tolakPesan">Menu Report Produksi cuma bisa dibuka oleh tim Produksi.</p>
    <div style="width:100%; max-width:320px; margin-top:10px">
      <button class="btn" onclick="kembaliKeApp()">Kembali ke Beranda</button>
    </div>
  </div>
</div>

<!-- ===== 3. SESI HABIS ===== -->
<div class="screen" id="screenSesi">
  <div class="center-screen">
    <div class="big-emoji">⏳</div>
    <div class="center-title">Sesi kamu sudah habis</div>
    <p class="info-text">Masuk lagi pakai PIN untuk melanjutkan.</p>
    <div style="width:100%; max-width:320px; margin-top:10px">
      <button class="btn" onclick="kembaliKeApp()">Masuk Lagi</button>
    </div>
  </div>
</div>

<!-- ===== 4. HALAMAN UTAMA ===== -->
<div class="screen" id="screenUtama">
  <div class="top-bar">
    <div class="back-btn" onclick="kembaliKeApp()">←</div>
    <div>
      <div class="top-title">Report Produksi</div>
      <div class="top-sub" id="sapaan">—</div>
    </div>
  </div>

  <div class="card" style="display:flex; align-items:center; gap:10px">
    <span class="role-chip" id="roleChip">🏭 Produksi</span>
    <span style="font-size:12.5px; color:var(--ink-soft); font-weight:600" id="catatanHr"></span>
  </div>

  <div class="card">
    <label for="datePicker">Pilih tanggal</label>
    <input type="date" id="datePicker">
    <div class="status-note" id="status">Memuat data…</div>
  </div>

  <div class="card">
    <label>Preview report</label>
    <pre class="preview" id="preview">—</pre>
    <button class="btn" id="shareBtn" disabled>Share ke WhatsApp</button>
    <button class="btn btn-secondary" id="copyBtn" disabled>Copy teks</button>
  </div>
</div>

<script>
// =====================================================================
// URL Apps Script Absensi — dipakai buat penjaga akses (getProfil).
// GANTI kalau URL Apps Script Absensi berubah.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxDjfUyqGAaSfJxBHZ2ULgXyttVSgTJFBt9D8KF6m-wvbcNEzEbol9DbtzzPoxMXP79/exec';

// Backend baru (Vercel) — getProfil sudah dipindah ke sini (TAHAP 2 migrasi,
// sudah diverifikasi paralel identik dengan Apps Script). Lihat app.js buat
// keterangan lengkap.
const VERCEL_BACKEND_URL = 'https://absensi-backend-ruby.vercel.app/api';

// URL Apps Script Dashboard Kulturama (Code_Kreatif.gs) — dipakai buat
// ambil data report. Ini project yang SAMA dipakai REPORT-KREATIF-index.html.
// Kalau sudah punya nilainya di sana, salin persis ke sini.
const APPS_SCRIPT_URL_DASHBOARD = 'https://script.google.com/macros/s/AKfycbx2FBnb68lCgmCe4iW2td12aQ_zvG0rqORuaFe8evdJFHQyKiH4QwZdxCa9cOjormAJ/exec';

// Role yang berhak membuka halaman ini. HR selalu boleh (superuser).
const ROLE_HALAMAN = 'produksi';
const NAMA_ROLE = 'Produksi';
// =====================================================================

const BULAN = ['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];

const datePicker = document.getElementById('datePicker');
const statusEl = document.getElementById('status');
const previewEl = document.getElementById('preview');
const shareBtn = document.getElementById('shareBtn');
const copyBtn = document.getElementById('copyBtn');

let currentText = '';

function todayISO() {
  const d = new Date();
  const tzOffset = d.getTimezoneOffset() * 60000;
  return new Date(d - tzOffset).toISOString().slice(0, 10);
}

function formatTanggalLabel(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${BULAN[m - 1]} ${y}`;
}

function fmtNum(n) {
  const num = Number(n);
  if (isNaN(num)) return String(n ?? '-');
  return num.toLocaleString('en-US');
}

// Affiliate sengaja TIDAK ditampilkan di teks WhatsApp (cuma disimpan di data).
function buildReportText(data) {
  const tgl = formatTanggalLabel(data.date);
  const k = data.konten || {};
  let body = '';

  if (k.videoPanjang) {
    body += `*Vid. Panjang SP*\n* Target = ${fmtNum(k.videoPanjang.target)} Vid/bulan\n* Progres = ${k.videoPanjang.progres}\n`;
  }
  if (k.videoPendek) {
    body += `*Vid. Pendek SP*\n* Target = ${fmtNum(k.videoPendek.target)} Vid/bulan\n* Progres = ${k.videoPendek.progres}\n`;
  }
  if (k.carousel) {
    body += `*Carousel SP*\n* Target = ${fmtNum(k.carousel.target)}/bulan\n* Progres = ${k.carousel.progres}\n`;
  }

  return `*REPORT PRODUKSI - ${tgl}*\n—\n${body}`.trim();
}

async function loadReport(dateISO) {
  statusEl.textContent = 'Memuat data…';
  statusEl.classList.remove('error');
  shareBtn.disabled = true;
  copyBtn.disabled = true;

  if (!APPS_SCRIPT_URL_DASHBOARD || APPS_SCRIPT_URL_DASHBOARD.includes('GANTI_DENGAN')) {
    statusEl.textContent = 'Belum di-setup: isi APPS_SCRIPT_URL_DASHBOARD di kode dulu.';
    statusEl.classList.add('error');
    return;
  }

  try {
    const url = `${APPS_SCRIPT_URL_DASHBOARD}?action=reportProduksi&date=${dateISO}&token=${encodeURIComponent(getToken())}`;
    const res = await fetch(url);
    const data = await res.json();

    // Sesi habis di tengah pemakaian (token kadaluarsa pas lagi buka halaman ini)
    if (data.code === 'UNAUTHORIZED' || data.code === 'FORBIDDEN') {
      statusEl.textContent = 'Sesi berubah. Muat ulang halaman ini.';
      statusEl.classList.add('error');
      previewEl.textContent = '—';
      return;
    }

    if (data.error === 'month_not_found') {
      statusEl.textContent = 'Belum ada data untuk bulan ini di sheet REPORT PRODUKSI.';
      statusEl.classList.add('error');
      previewEl.textContent = '—';
      return;
    }
    if (data.error) {
      statusEl.textContent = 'Data belum ada di sheet.';
      statusEl.classList.add('error');
      previewEl.textContent = '—';
      return;
    }

    currentText = buildReportText(data);
    previewEl.textContent = currentText;
    statusEl.textContent = 'Data ditemukan ✓';
    shareBtn.disabled = false;
    copyBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = 'Gagal ambil data. Cek koneksi internet.';
    statusEl.classList.add('error');
    console.error(err);
  }
}

datePicker.addEventListener('change', () => loadReport(datePicker.value));

shareBtn.addEventListener('click', () => {
  if (!currentText) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(currentText)}`, '_blank');
});

copyBtn.addEventListener('click', async () => {
  if (!currentText) return;
  try {
    await navigator.clipboard.writeText(currentText);
    copyBtn.textContent = 'Tersalin ✓';
    setTimeout(() => (copyBtn.textContent = 'Copy teks'), 1500);
  } catch (err) {
    console.error(err);
  }
});

function tampilkanLayar(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function kembaliKeApp() { window.location.href = 'index.html'; }

function getToken() { return localStorage.getItem('absensi_token') || ''; }

// PENJAGA AKSES.
// Role TIDAK diambil dari localStorage, tapi ditanyakan ulang ke server pakai
// token. Alasannya: isi localStorage gampang diedit sendiri lewat DevTools,
// sedangkan token ditandatangani server dan gak bisa dipalsukan.
// Ini tetap bukan pengaman utama — pengaman sebenarnya ada di endpoint data
// (setiap permintaan report dicek ulang role-nya di server).
async function periksaAkses() {
  const token = getToken();
  if (!token) { tampilkanLayar('screenSesi'); return; }

  try {
    const res = await fetch(VERCEL_BACKEND_URL + '/getProfil?token=' + encodeURIComponent(token));
    const data = await res.json();

    if (data.code === 'UNAUTHORIZED' || data.result !== 'success') {
      tampilkanLayar('screenSesi');
      return;
    }

    const role = (data.role || '').toLowerCase();
    // HR & admin = superuser (admin dipakai buat pihak eksternal
    // yang butuh akses penuh tapi bukan karyawan).
    const boleh = (role === ROLE_HALAMAN) || (role === 'hr') || (role === 'admin');

    if (!boleh) {
      document.getElementById('tolakPesan').textContent =
        'Menu Report ' + NAMA_ROLE + ' cuma bisa dibuka oleh tim ' + NAMA_ROLE + '. Role kamu: ' + (role || 'belum diatur') + '.';
      tampilkanLayar('screenTolak');
      return;
    }

    document.getElementById('sapaan').textContent = 'Halo, ' + data.nama;
    if (role === 'hr' || role === 'admin') {
      document.getElementById('catatanHr').textContent = 'Dibuka sebagai ' + role.toUpperCase();
    }
    tampilkanLayar('screenUtama');

    const tgl = todayISO();
    datePicker.value = tgl;
    loadReport(tgl);

  } catch (err) {
    document.getElementById('tolakPesan').textContent =
      'Tidak bisa menghubungi server. Cek koneksi internet, lalu coba lagi.';
    tampilkanLayar('screenTolak');
  }
}

window.addEventListener('DOMContentLoaded', periksaAkses);
</script>
</body>
</html>
